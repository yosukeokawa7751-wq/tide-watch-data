# Sentinel-3 の全区画の濁り推定(TSM_NN)を期間ぶん出す(手動のみ・Sentinel-2 との突き合わせ用)。データは commit しない。
name: s3cells
on:
  workflow_dispatch:
    inputs:
      months: { description: "月(空白区切り YYYY-MM)", required: true, default: "2026-07 2026-08 2026-09 2026-10" }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { m: "${{ steps.p.outputs.m }}" }
    steps:
      - id: p
        run: echo "m=$(echo '${{ inputs.months }}' | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read().split()))')" >> $GITHUB_OUTPUT
  cells:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, matrix: { month: "${{ fromJson(needs.plan.outputs.m) }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy requests netCDF4
      - run: |
          M=${{ matrix.month }}
          S=$M-01; E=$(python3 -c "import datetime as d,calendar as c;y,m=map(int,'$M'.split('-'));print(f'{y}-{m:02d}-{c.monthrange(y,m)[1]}')")
          python turbidity/s3probe.py $S $E s3cells_$M.csv
        env:
          CDSE_USER: ${{ secrets.CDSE_USER }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "s3cells-${{ matrix.month }}", path: "s3cells_*.csv", if-no-files-found: ignore }
