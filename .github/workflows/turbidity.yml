# 衛星(Sentinel-2)の画像から、海岸沿いの区画ごとの「いつもより濁っているか」を毎日出す。
# 時計アプリ(タイド)は turbidity/latest.json だけを取りに来る。
# Sentinel-2 の撮影は日本時間10:37ごろ。公開は数時間後なので、日本時間 15時と23時に回す。
name: turbidity
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turbidity
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: turbidity/requirements.txt
      - run: pip install -r turbidity/requirements.txt
      - run: python turbidity/pipeline.py daily
      - name: commit
        run: |
          git config user.name "turbidity-bot"
          git config user.email "turbidity-bot@users.noreply.github.com"
          git add turbidity/obs.csv turbidity/latest.json
          git diff --cached --quiet || git commit -m "turbidity: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
