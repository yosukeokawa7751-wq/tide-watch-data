# 衛星(Sentinel-2)の画像から、海岸沿いの区画ごとの「いつもより濁っているか」を毎日出す。
# 時計アプリ(タイド)は turbidity/latest.json だけを取りに来る(Sentinel-3 で埋めた区画も混ざる。2026-10-11〜)。
# Sentinel-2 の撮影は日本時間10:37ごろ。公開は撮影の約4〜5時間後(実測 2026-10-11: Earth Search 3.8〜5.0時間)。
# 1回は約40秒(房総・東京湾だけの頃。仙台〜三重に広げた後は数分の見込み)で終わるので、公開されうる 日本時間12〜18時は毎時、ほかに23時に回す(当日の画像を早く出すため)。
name: turbidity
on:
  schedule:
    - cron: "0 3-9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turbidity
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: turbidity/requirements.txt
      - run: pip install -r turbidity/requirements.txt
      - run: python turbidity/pipeline.py daily
      # Sentinel-3。撮影の約2時間後に公開されるので日本時間12時から拾える。
      # Sentinel-2 で測れていない所だけを「やや濁り」までで latest.json に埋める(s3.py の merge)。
      # 失敗しても Sentinel-2 だけの latest.json はそのまま出る
      - run: cd turbidity && python s3.py daily
        continue-on-error: true
        env:
          CDSE_USER: ${{ secrets.CDSE_USER }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      - name: commit
        run: |
          git config user.name "turbidity-bot"
          git config user.email "turbidity-bot@users.noreply.github.com"
          git add turbidity/obs turbidity/latest.json
          git add turbidity/latest_s3.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "turbidity: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # 時計の配信元を自分のドメイン(data.yo-su.com)につないだ Cloudflare R2 へ移す(2026-11-07 ユーザー判断)。
      # raw.githubusercontent.com は未認証の取得に上限があり・アカウント名に縛られ・アプリの公開後は替えられないため
      # (→ tide-watch の docs/sales-readiness.md)。同じ latest.json を同じパスに置く。
      # 鍵が Secrets に入るまでは何もしない。GitHub への commit は時計が移り終わるまで残す(commit の後に置くのはそのため)。
      # max-age=300 は raw.githubusercontent.com と同じ。チェックサムの2つは AWS CLI の新しい既定が R2 と合わない時の保険
      - name: upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: tide-watch-data
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 の鍵が Secrets に無いので飛ばす"; exit 0
          fi
          aws s3 cp turbidity/latest.json "s3://$R2_BUCKET/turbidity/latest.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type "application/json" --cache-control "max-age=300" --only-show-errors
          echo "R2 へ置いた: $(wc -c < turbidity/latest.json)B"
