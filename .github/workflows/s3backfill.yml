# Sentinel-3 の過去分(基準づくり)。手動のみ。月ごとに並べ、結果は成果物(CSV)。手元でまとめて obs_s3.csv に入れる。
# Copernicus は同時の接続数に上限があるので、並べるのは4本まで。
name: s3backfill
on:
  workflow_dispatch:
    inputs:
      start: { description: "最初の月 YYYY-MM", required: true, default: "2023-01" }
      end:   { description: "最後の月 YYYY-MM", required: true, default: "2026-10" }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { m: "${{ steps.p.outputs.m }}" }
    steps:
      - id: p
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          y, m = map(int, "${{ inputs.start }}".split("-")); ey, em = map(int, "${{ inputs.end }}".split("-"))
          out = []
          while (y, m) <= (ey, em):
              out.append(f"{y}-{m:02d}"); m += 1
              if m > 12: y, m = y + 1, 1
          print("m=" + json.dumps(out))
          PY
  month:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, max-parallel: 4, matrix: { month: "${{ fromJson(needs.plan.outputs.m) }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: turbidity/requirements.txt }
      - run: pip install -r turbidity/requirements.txt
      - run: |
          M=${{ matrix.month }}
          E=$(python3 -c "import calendar as c;y,m=map(int,'$M'.split('-'));print(f'{y}-{m:02d}-{c.monthrange(y,m)[1]}')")
          cd turbidity && python s3.py backfill $M-01 $E ../s3_$M.csv
        env:
          CDSE_USER: ${{ secrets.CDSE_USER }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "s3-${{ matrix.month }}", path: "s3_*.csv", if-no-files-found: ignore }
